# Restaurant Management System — production stack (Caddy single entrypoint).
#
# Services:
#   backend — Express + GraphQL + SSE on :5000 (internal only, no published
#             ports). SQLite file persists in the `backend-data` volume via a
#             /data symlink (see backend/Dockerfile).
#   web     — Caddy v2: serves the frontend production bundle from
#             /srv/frontend and reverse-proxies /graphql, /events, /api-docs
#             and /images to `backend:5000` (see root Caddyfile).
#
# First-time setup:
#   cp backend/.env.example backend/.env   # then set a strong JWT_SECRET
#
# Usage:
#   docker compose up --build -d   # build + start (http://localhost)
#   docker compose logs -f         # follow logs
#   docker compose down            # stop (volumes kept)
#   docker compose run --rm backend node dist/seeds.js   # seed demo users/data
#
# Custom domain with automatic HTTPS (Caddy handles certs):
#   DOMAIN=restaurant.example.com APP_PORT=80 APP_HTTPS_PORT=443 docker compose up --build -d

name: restaurant-management

services:
  backend:
    build:
      context: ./backend
    image: restaurant-backend:latest
    restart: unless-stopped
    # Requires backend/.env to exist with JWT_SECRET (see backend/.env.example).
    env_file:
      - ./backend/.env
    environment:
      PORT: '5000'
    volumes:
      - backend-data:/data
    expose:
      - '5000'

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Same-origin URLs so the browser talks to Caddy, never to the
        # backend directly (no CORS issues). Empty string = same-origin.
        REACT_APP_GRAPHQL_URL: /graphql
        REACT_APP_WS_URL: ''
        REACT_APP_API_URL: ''
    image: restaurant-web:latest
    restart: unless-stopped
    ports:
      - '${APP_PORT:-80}:80'
      - '${APP_HTTPS_PORT:-443}:443'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      BACKEND_UPSTREAM: backend:5000
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  backend-data:
  caddy-data:
  caddy-config:
